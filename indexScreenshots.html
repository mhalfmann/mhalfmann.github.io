<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshots</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/ui.css">
  <link rel="stylesheet" href="./css/gallery.css">
</head>
<body class="site-body">
  <header class="site-header">
    <div id="listButton" class="uiIcon" aria-label="Menü">
      <img id="listIcon" src="./Assets/Icons/menu.png" alt="">
    </div>
    <div class="site-header__title">Screenshots</div>
    <div id="list">
      <div class="uiListItem" href="./indexApps.html" onclick="gotoPage(this)">Applikationen</div>
      <div class="uiListItem" href="./indexScreenshots.html" onclick="gotoPage(this)">Screenshots</div>
      <div class="uiListItem" href="./indexMockup.html" onclick="gotoPage(this)">Mockups</div>
    </div>
    <a class="home-link" href="./index.html" aria-label="Home">
      <div class="uiIcon">
        <img src="./Assets/Icons/home.png" alt="">
      </div>
    </a>
  </header>

  <main class="site-main">
    <div class="shot-toolbar">
      <h1>Galerie</h1>
      <div id="shotStatus" class="shot-status"></div>
    </div>
    <div id="shotFilters" class="shot-filters" aria-label="Alben"></div>
    <div id="shotGrid" class="shot-grid" aria-live="polite"></div>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <div class="lightbox__backdrop" aria-hidden="true"></div>
    <div class="lightbox__panel" role="dialog" aria-modal="true" aria-label="Screenshot-Ansicht">
      <div class="lightbox__stage">
        <button type="button" id="lightboxPrev" class="lightbox__nav lightbox__nav--prev" aria-label="Vorheriges Bild">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <a id="lightboxLink" href="" target="_blank" rel="noopener noreferrer">
          <img id="lightboxImage" alt="">
        </a>
        <button type="button" id="lightboxNext" class="lightbox__nav lightbox__nav--next" aria-label="Nächstes Bild">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
        <button type="button" id="lightboxClose" class="lightbox__close" aria-label="Schließen">
          <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
        </button>
      </div>
      <div class="lightbox__footer">
        <span id="lightboxCaption"></span>
        <span id="lightboxCounter" class="lightbox__counter"></span>
      </div>
    </div>
  </div>

  <script src="./Javascript/jquery-3.4.0.min.js"></script>
  <script src="./Javascript/site-nav.js"></script>
  <!-- optional: album names from generate-screenshots.ps1; images are always live-scanned -->
  <script src="./Javascript/screenshots-data.js"></script>
  <script src="./Javascript/screenshots-gallery.js"></script>
</body>
</html>
