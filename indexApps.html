<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applikationen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/ui.css">
</head>
<body class="site-body" onselectstart="return false">
  <header class="site-header">
    <div id="listButton" class="uiIcon" aria-label="Menü">
      <img id="listIcon" src="./Assets/Icons/menu.png" alt="">
    </div>
    <div class="site-header__title">Applikationen</div>
    <div id="list">
      <div class="uiListItem" href="./indexApps.html" onclick="gotoPage(this)">Applikationen</div>
      <div class="uiListItem" href="./indexScreenshots.html" onclick="gotoPage(this)">Bildergalerie</div>
      <div class="uiListItem" href="./indexMockup.html" onclick="gotoPage(this)">Mockups</div>
    </div>
    <a class="home-link" href="./index.html" aria-label="Home">
      <div class="uiIcon">
        <img src="./Assets/Icons/home.png" alt="">
      </div>
    </a>
  </header>

  <main class="site-main">
    <div class="apps-toolbar">
      <h1>Apps</h1>
      <div id="appsStatus" class="apps-status" hidden></div>
    </div>

    <div id="appsGrid" class="apps-grid" aria-live="polite"></div>

    <div id="select" class="uiDialogue" style="visibility: hidden;">
      <div class="uiDialogueElement">Modus:</div>
      <input id="szene" class="uiDialogueElement" type="number" value="0" min="0" max="2">
      <div id="link" class="uiButton2" onclick="openLink()" role="button">Start</div>
    </div>
  </main>

  <script src="./Javascript/jquery-3.4.0.min.js"></script>
  <script src="./Javascript/site-nav.js"></script>
  <script src="./Javascript/apps-data.js"></script>
  <script src="./Javascript/apps-catalog.js"></script>
</body>
</html>
